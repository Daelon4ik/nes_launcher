[package]
name = "nes_launhder"
version = "0.1.0"
description = "NES game launcher with built-in emulator"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }

[lib]
name = "nes_launhder_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
